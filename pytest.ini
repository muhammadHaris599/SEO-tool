[pytest]
# Pytest configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage settings
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for workflows
    routes: API route tests
    slow: Tests that take longer to run

# Asyncio mode
asyncio_mode = auto

# Test discovery
norecursedirs = .git .venv venv node_modules __pycache__ *.egg

# Output options
console_output_style = progress

# Timeout (optional)
timeout = 30
